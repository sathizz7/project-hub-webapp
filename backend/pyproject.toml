[project]
name = "projecthub-backend"
version = "0.1.0"
description = "ProjectHub FastAPI backend — see docs/superpowers/specs/2026-05-09-projecthub-fastapi-backend-design.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.34",
    "psycopg[pool,binary]>=3.2,<3.3",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "alembic>=1.13,<2",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]
prod = [
    "gunicorn>=23.0,<24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"
